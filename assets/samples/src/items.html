<!doctype html>
<!-- Made-up sample photos for Pass It On, drawn in SVG so no real person's stuff is in the repo.
     Render with assets/samples/render.sh. Variants: #ti84, #ti84-checkin, #ti84-other, #goggles -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 900px; overflow: hidden; }
  .scene { position: relative; width: 1200px; height: 900px; overflow: hidden; }
  .desk { background:
      repeating-linear-gradient(92deg, rgba(0,0,0,.05) 0 3px, transparent 3px 11px),
      repeating-linear-gradient(88deg, rgba(255,255,255,.04) 0 2px, transparent 2px 23px),
      linear-gradient(180deg, #9a6b43, #7d5233 60%, #6c4529); }
  .table { background:
      radial-gradient(circle at 30% 20%, rgba(255,255,255,.18), transparent 55%),
      repeating-radial-gradient(circle at 70% 80%, rgba(0,0,0,.025) 0 2px, transparent 2px 5px),
      linear-gradient(160deg, #b9bcc0, #9ea2a7); }
  .bench { background:
      radial-gradient(circle at 60% 30%, rgba(255,255,255,.10), transparent 50%),
      repeating-radial-gradient(circle at 20% 70%, rgba(255,255,255,.015) 0 1px, transparent 1px 4px),
      linear-gradient(170deg, #2a2d31, #1c1e21); }
  .thing { position: absolute; left: 50%; top: 50%; filter: drop-shadow(18px 26px 22px rgba(0,0,0,.45)); }
  .light { position: absolute; inset: 0; pointer-events: none;
           background: radial-gradient(ellipse at 40% 35%, rgba(255,240,215,.22), transparent 60%),
                       radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.42)); }
  .warm { background: radial-gradient(ellipse at 65% 30%, rgba(255,210,150,.25), transparent 60%),
                      radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,.5)); }
  .grain { position: absolute; inset: 0; opacity: .16; mix-blend-mode: overlay; pointer-events: none; }
  .tag { position: absolute; left: 22px; bottom: 16px; font: 500 13px/1 -apple-system, Helvetica, sans-serif;
         color: rgba(255,255,255,.55); letter-spacing: .02em; }
</style>
</head>
<body>
<div class="scene" id="scene">
  <div class="thing" id="thing"></div>
  <div class="light" id="light"></div>
  <svg class="grain" width="1200" height="900"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/></filter><rect width="1200" height="900" filter="url(#n)"/></svg>
  <div class="tag">Sample · made-up item, not a real student's</div>
</div>

<template id="calc">
<svg width="380" height="800" viewBox="0 0 380 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="body" x1="0" x2="1"><stop offset="0" stop-color="var(--b1)"/><stop offset=".5" stop-color="var(--b2)"/><stop offset="1" stop-color="var(--b1)"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef3f6"/><stop offset="1" stop-color="#d9e2e8"/></linearGradient>
  </defs>
  <rect x="6" y="6" width="368" height="788" rx="44" fill="url(#body)"/>
  <rect x="6" y="6" width="368" height="788" rx="44" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="2"/>
  <text x="190" y="44" text-anchor="middle" font-family="Helvetica, Arial" font-size="13" font-weight="700" fill="var(--ink)" letter-spacing="2">TEXAS INSTRUMENTS</text>
  <rect x="34" y="60" width="312" height="236" rx="16" fill="#15171a"/>
  <rect x="52" y="76" width="276" height="196" rx="4" fill="url(#screen)"/>
  <!-- the graph on screen -->
  <line x1="62" y1="174" x2="318" y2="174" stroke="#9aa6ae" stroke-width="1.2"/>
  <line x1="190" y1="86" x2="190" y2="262" stroke="#9aa6ae" stroke-width="1.2"/>
  <path d="M78 96 Q190 330 302 96" fill="none" stroke="#1f6fd1" stroke-width="3"/>
  <path d="M70 230 C120 120 170 210 210 140 S280 120 312 200" fill="none" stroke="#d2312d" stroke-width="3"/>
  <text x="60" y="94" font-family="Menlo, monospace" font-size="11" fill="#55606a">NORMAL FLOAT AUTO REAL RADIAN</text>
  <text x="30" y="324" font-family="Helvetica, Arial" font-size="19" font-weight="700" font-style="italic" fill="var(--ink)">TI-84 Plus CE</text>
  <!-- function keys -->
  <g fill="var(--fkey)">
    <rect x="34" y="342" width="52" height="16" rx="8"/><rect x="96" y="342" width="52" height="16" rx="8"/>
    <rect x="158" y="342" width="52" height="16" rx="8"/><rect x="220" y="342" width="52" height="16" rx="8"/>
    <rect x="282" y="342" width="52" height="16" rx="8"/>
  </g>
  <!-- 2nd / mode / del, arrows -->
  <rect x="34" y="378" width="52" height="30" rx="7" fill="#3a8fd8"/><rect x="96" y="378" width="52" height="30" rx="7" fill="var(--key)"/>
  <rect x="158" y="378" width="52" height="30" rx="7" fill="var(--key)"/>
  <rect x="34" y="420" width="52" height="30" rx="7" fill="#59b35a"/><rect x="96" y="420" width="52" height="30" rx="7" fill="var(--key)"/>
  <rect x="158" y="420" width="52" height="30" rx="7" fill="var(--key)"/>
  <circle cx="290" cy="414" r="46" fill="var(--key)"/><circle cx="290" cy="414" r="18" fill="var(--b2)"/>
  <!-- main grid -->
  <g id="grid"></g>
  <!-- marks only Maya's has (set by script) -->
  <g id="marks"></g>
</svg>
</template>

<template id="goggles">
<svg width="980" height="640" viewBox="0 0 980 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lens" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgba(225,240,248,.22)"/><stop offset="1" stop-color="rgba(190,215,230,.14)"/></linearGradient>
    <linearGradient id="glass" x1="0" x2="1"><stop offset="0" stop-color="rgba(220,235,245,.55)"/><stop offset="1" stop-color="rgba(200,220,235,.35)"/></linearGradient>
  </defs>
  <g transform="translate(40 330)">
    <path d="M20 0 L120 0 L120 16 L112 16 L112 210 Q112 250 72 250 L68 250 Q28 250 28 210 L28 16 L20 16 Z" fill="url(#glass)" stroke="rgba(255,255,255,.55)" stroke-width="3"/>
    <path d="M30 150 L110 150 L110 210 Q110 246 72 246 L68 246 Q30 246 30 210 Z" fill="rgba(80,170,220,.35)"/>
    <g stroke="rgba(255,255,255,.7)" stroke-width="2"><path d="M100 60 h12"/><path d="M100 90 h12"/><path d="M100 120 h12"/></g>
  </g>
  <g transform="translate(150 70)">
    <path d="M40 300 C 40 120, 240 60, 410 70 C 580 60, 780 120, 780 300" fill="none" stroke="#1f5fbf" stroke-width="30" stroke-linecap="round"/>
    <path d="M40 300 C 40 120, 240 60, 410 70 C 580 60, 780 120, 780 300" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="2" stroke-dasharray="6 9"/>
    <rect x="186" y="74" width="46" height="38" rx="6" fill="#d7dde2" stroke="#9aa6af" stroke-width="2" transform="rotate(-18 209 93)"/>
    <g transform="translate(560 86) rotate(14)">
      <rect x="-48" y="-21" width="96" height="42" rx="3" fill="#efe2b8" opacity=".96"/>
      <text x="0" y="9" text-anchor="middle" font-family="Marker Felt, Chalkboard, Comic Sans MS, cursive" font-size="23" fill="#2b2b2b">P.S.</text>
    </g>
    <path d="M112 226 Q 120 176 205 176 L 615 176 Q 700 176 708 226 L 718 326 Q 722 392 652 396 L 505 398 Q 455 398 438 360 Q 410 320 382 360 Q 365 398 315 398 L 168 396 Q 98 392 102 326 Z" fill="url(#lens)"/>
    <path d="M90 220 Q 100 150 200 150 L 620 150 Q 720 150 730 220 L 742 330 Q 748 410 660 418 L 500 420 Q 440 420 420 372 Q 410 350 400 372 Q 380 420 320 420 L 160 418 Q 72 410 78 330 Z"
          fill="none" stroke="rgba(214,228,236,.80)" stroke-width="22" stroke-linejoin="round"/>
    <g fill="#c9d4db" stroke="#93a3ad" stroke-width="2">
      <rect x="226" y="140" width="52" height="20" rx="6"/><rect x="542" y="140" width="52" height="20" rx="6"/>
      <rect x="74" y="250" width="20" height="52" rx="6"/><rect x="726" y="250" width="20" height="52" rx="6"/>
    </g>
    <g stroke="#8494a0" stroke-width="2"><path d="M236 150 h32"/><path d="M552 150 h32"/></g>
    <text x="410" y="200" text-anchor="middle" font-family="Helvetica, Arial" font-size="18" font-weight="700" fill="rgba(235,242,247,.85)" letter-spacing="1">Z87+ D3</text>
    <path d="M150 230 Q 260 210 330 225" stroke="rgba(255,255,255,.7)" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M520 225 Q 600 212 660 230" stroke="rgba(255,255,255,.5)" stroke-width="5" fill="none" stroke-linecap="round"/>
    <g stroke="rgba(255,255,255,.75)" stroke-width="1.8" stroke-linecap="round"><path d="M150 350 l 48 -22"/><path d="M158 360 l 40 -18"/><path d="M168 368 l 26 -12"/></g>
  </g>
</svg>
</template>

<script>
  const variant = location.hash.slice(1) || "ti84";
  const scene = document.getElementById("scene");
  const thing = document.getElementById("thing");
  const light = document.getElementById("light");

  function calculator(colors, marks) {
    thing.appendChild(document.getElementById("calc").content.cloneNode(true));
    const svg = thing.querySelector("svg");
    for (const [k, v] of Object.entries(colors)) svg.style.setProperty(k, v);
    const grid = svg.getElementById("grid");
    const ns = "http://www.w3.org/2000/svg";
    for (let r = 0; r < 8; r++) for (let c = 0; c < 5; c++) {
      const key = document.createElementNS(ns, "rect");
      const numeric = r >= 3 && c >= 1 && c <= 3;
      const enter = r === 7 && c === 4;
      key.setAttribute("x", 34 + c * 62); key.setAttribute("y", 472 + r * 38);
      key.setAttribute("width", 52); key.setAttribute("height", 28); key.setAttribute("rx", 7);
      key.setAttribute("fill", enter ? "#3a8fd8" : numeric ? colors["--num"] : colors["--key"]);
      grid.appendChild(key);
    }
    if (marks) svg.getElementById("marks").innerHTML = `
      <g transform="translate(318 742) rotate(-12)">
        <circle r="27" fill="#ffd23f" stroke="#e0a800" stroke-width="2"/>
        <circle cx="-9" cy="-6" r="3.6" fill="#3b2a00"/><circle cx="9" cy="-6" r="3.6" fill="#3b2a00"/>
        <path d="M-13 6 Q0 19 13 6" stroke="#3b2a00" stroke-width="3.2" fill="none" stroke-linecap="round"/>
      </g>
      <g stroke="rgba(255,255,255,.55)" stroke-width="1.4" stroke-linecap="round">
        <path d="M22 70 l 34 40"/><path d="M27 66 l 30 36"/><path d="M33 80 l 18 22"/>
      </g>`;
  }

  if (variant === "ti84") {
    scene.classList.add("desk");
    calculator({"--b1": "#2b2f35", "--b2": "#3a3f47", "--key": "#22252a", "--num": "#e9ebee", "--fkey": "#e9ebee", "--ink": "#d8dde3"}, true);
    thing.style.transform = "translate(-50%, -50%) rotate(-9deg) scale(1.02)";
  } else if (variant === "ti84-checkin") {
    scene.classList.add("table");
    light.classList.add("warm");
    calculator({"--b1": "#2b2f35", "--b2": "#3a3f47", "--key": "#22252a", "--num": "#e9ebee", "--fkey": "#e9ebee", "--ink": "#d8dde3"}, true);
    thing.style.transform = "translate(-46%, -52%) rotate(6deg) scale(.94)";
  } else if (variant === "ti84-other") {
    scene.classList.add("table");
    calculator({"--b1": "#d9dce0", "--b2": "#f1f2f4", "--key": "#5b6068", "--num": "#ffffff", "--fkey": "#5b6068", "--ink": "#3d424a"}, false);
    thing.style.transform = "translate(-50%, -50%) rotate(4deg) scale(.96)";
  } else if (variant === "goggles") {
    scene.classList.add("bench");
    thing.appendChild(document.getElementById("goggles").content.cloneNode(true));
    thing.style.transform = "translate(-50%, -50%) rotate(-4deg) scale(1.05)";
  }
</script>
</body>
</html>
